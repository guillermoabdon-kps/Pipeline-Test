name: Build & Push to ACR (Dev)

# Compila el código, construye la imagen Docker y la publica en Azure Container Registry.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Parámetros del ACR almacenados en el repo:
#   - vars.ACR_LOGIN_SERVER  -> Repository Variable (ej: midevacr.azurecr.io)
#   - vars.IMAGE_NAME        -> Repository Variable (ej: dev-pipeline-demo)
#   - secrets.ACR_USERNAME   -> Repository Secret   (usuario / admin del ACR)
#   - secrets.ACR_PASSWORD   -> Repository Secret   (password / token del ACR)
env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1. Compilar / verificar el código ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build (compile/check)
        run: npm run build

      # ---- 2. Construir y publicar la imagen ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Imagen publicada :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest\`" >> "$GITHUB_STEP_SUMMARY"
